# LEGACY TIME MODEL: every grid point sets time.legacy_K (the old tasks.K), so these files reproduce the E1 runs of
# 2026-10-10 exactly. At 10 ps per tick their control steps are 20 ps to 100 ns; the memory results are a
# step-length artifact and superseded (NOTES.md 2026-10-10 correction). The physical-K version is e1_phys*.yaml.
#
# E1, memory is cheap with delays (docs/experiments.md): seven memory tasks on freerun across delay scale
# (unit [1, 1]; 1-8 ticks [1, 8]; SKY130 nominal [3, 12] = 30-120 ps at 10 ps per tick) and K (2, 8, 32 ticks per
# control step), 1600 generations x 64 edits = 102,400 edits per task. Each grid point is one file
# e1_<scale>_k<K>.yaml that overrides time.legacy_K and the delay range only. Delays stay inside the range (delay_clamp),
# so the delay scale is fixed per grid point. Everything else is signal_small's protocol (DAgger every 100, threshold
# blend of task return at w = 0.25).
base: ../signal_small.yaml
name: e1_base
workers: 7
# freerun's CPU backend, one thread per worker: at this batch size (64 children x 2-4 episodes per call) the CUDA
# backend is latency-bound (~12 us per lookahead window, ~25 ms per call at K = 32 with SKY130 delays) and a search
# runs 1.3-2.6x slower on it than on 7 CPU workers (E0 profile, NOTES 2026-10-09). The backends are bit-exact, so
# the choice does not change results; e1_sky130_k32 is cross-checked on CUDA (--set substrate.backend=cuda).
substrate: {name: freerun, backend: cpu, threads: 1}
time: {tick: 1.0e-11, legacy_K: 8}
tasks:
  source: catalog
  names: [detect_1011, and2_delay3, divide_by_2, divide_by_3, divide_by_4, divide_by_5, interval_compare_12]
  extra:                  # counters mod 2, 4, 5: the catalog's divide_by_3 with n changed
    - {name: divide_by_2, kind: counter, params: {n: 2, out: wrap, p_pulse: 0.5, p_reset: 0.005}}
    - {name: divide_by_4, kind: counter, params: {n: 4, out: wrap, p_pulse: 0.5, p_reset: 0.005}}
    - {name: divide_by_5, kind: counter, params: {n: 5, out: wrap, p_pulse: 0.5, p_reset: 0.005}}
search:
  generations: 1600
  operator:
    delay_range: [1, 1]
    delay_clamp: true
status_every: 100
