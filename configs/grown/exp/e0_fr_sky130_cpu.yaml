# E0: freerun with SKY130-nominal delays, CPU backend.
#
# Our gates are arbitrary LUTs (any truth table, arity up to 4), not library cells, so freerun's Liberty annotation
# (freerun.cells / liberty, which needs a gate-level netlist of sky130_fd_sc_hd cells) does not apply. Instead every
# rise and fall arc delay, and every delay element, is drawn uniformly from the SKY130 hd nominal range 30-120 ps at
# 10 ps per tick, i.e. [3, 12] ticks, and stays there (delay_clamp). A control step is K = 8 ticks = 80 ps, so a
# single gate can take up to 1.5 control steps.
base: e0_base.yaml
name: e0_fr_sky130_cpu
substrate: {name: freerun, backend: cpu, threads: 1}
search:
  operator:
    delay_range: [3, 12]
