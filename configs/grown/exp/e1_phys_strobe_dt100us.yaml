# e1_phys_strobe.yaml at dt = 100 us (10 kHz sample rate): K = 10^7 ticks per step, budget 10^5 transitions per step
# (event_rate 1e9 x 100 us); the strobe is still 100 ns wide. Axes as e1_phys_dt100us.yaml.
base: e1_phys_strobe.yaml
name: e1_phys_strobe_dt100us
tasks:
  dt: 1.0e-4
archive:
  axes:
    - {name: n_gates, lo: 0, hi: 128, bins: 8, log: true}
    - {name: cycle_frac, lo: 0.0, hi: 1.0, bins: 4}
    - {name: events_per_step, lo: 0, hi: 10000000, bins: 8, source: behavior, log: true}
    - {name: duty_mean, lo: 0.0, hi: 1.0, bins: 4, source: behavior}
